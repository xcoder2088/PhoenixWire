}[locale]||null;
const U=usdtWords||{eyebrow:'Secure USDT Claim'},chainName={ethereum:'Ethereum',polygon:'Polygon'};
let evm=null,evmPoll=null;
const evmStep=document.getElementById('evm-step'),evmAddress=document.getElementById('evm-address'),evmClaim=document.getElementById('evm-claim'),evmTx=document.getElementById('evm-tx'),evmConfirm=document.getElementById('evm-confirm');
const explorerOK=u=>typeof u==='string'&&/^https:\/\/(etherscan\.io|polygonscan\.com)\/tx\/0x[0-9a-fA-F]{64}$/.test(u);
const addressOK=a=>/^0x[0-9a-fA-F]{40}$/.test(a);
function evmPaletteFor(v){const even=(parseInt(String(v.id).slice(2,4),16)||0)%2===0;return v.chain==='ethereum'?(even?2:11):(even?1:8)}
const hideCode=()=>{canVerify=false;send.hidden=true;verify.hidden=true;document.getElementById('digits').hidden=true;document.querySelector('label[for="otp"]').hidden=true};
function showAddressStep(note){
 hideCode();const chain=chainName[evm.chain]||'';
 document.querySelector('.inner h2').textContent=U.title;document.querySelector('.inner p').textContent=U.help.replace('{chain}',chain);
 document.getElementById('evm-label').textContent=U.label.replace('{chain}',chain);evmClaim.textContent=U.next+' →';
 evmStep.hidden=false;evmConfirm.hidden=true;evmAddress.hidden=false;evmClaim.hidden=false;document.getElementById('evm-label').hidden=false;if(note)setStatus(note,'ok');updateControls();
}
function showConfirmStep(address){
 document.querySelector('.inner h2').textContent=U.confirmTitle;document.querySelector('.inner p').textContent='';
 evmAddress.hidden=true;evmClaim.hidden=true;document.getElementById('evm-label').hidden=true;
 document.getElementById('evm-confirm-help').textContent=U.confirmHelp;document.getElementById('evm-confirm-address').textContent=address;
 document.getElementById('evm-confirm-yes').textContent=U.confirmYes+' →';document.getElementById('evm-confirm-back').textContent=U.back;
 evmConfirm.hidden=false;setStatus('','');
}
// After the address is given: waiting for the sender, then paid / cancelled / expired.
function showFinal(v){
 hideCode();evmStep.hidden=false;evmConfirm.hidden=true;evmAddress.hidden=true;evmClaim.hidden=true;document.getElementById('evm-label').hidden=true;
 document.querySelector('.inner h2').textContent=v.state==='ready'?U.waitTitle:'';document.querySelector('.inner p').textContent='';
 if(explorerOK(v.tx_url)){evmTx.href=v.tx_url;evmTx.textContent=U.view+' →';evmTx.hidden=false}
 if(v.state==='paid')setStatus(U.paid,'ok');else if(v.state==='cancelled')setStatus(U.cancelled,'error');else if(v.state==='expired')setStatus(U.expired,'error');else setStatus(U.ready,'ok');
}
async function pollEvm(){
 clearTimeout(evmPoll);
 try{const r=await fetch('/api/v1/claims/'+encodeURIComponent(claimId),{cache:'no-store'});const v=await r.json();
  if(r.ok){evm=Object.assign(evm,v);showFinal(v);if(v.state==='ready')evmPoll=setTimeout(pollEvm,8000)}
 }catch{evmPoll=setTimeout(pollEvm,10000)}
}
function evmErrorText(code){return {invalid_address:U.badAddress,same_address:U.same,chain_unavailable:U.chain,claim_expired:U.expired,card_cancelled:U.cancelled,address_already_given:U.already,email_not_verified:U.notVerified}[code]||feedback[3]}
function networkMark(asset,language){
 const marks={usdt_polygon:['USDT','Polygon'],usdt_ethereum:['USDT','Ethereum'],usdc_polygon:['USDC','Polygon']},id=String(asset||'').toLowerCase(),mark=Object.hasOwn(marks,id)?marks[id]:null;if(!mark)return null;
 const words={fr:'{symbol} sur {chain}',en:'{symbol} on {chain}',es:'{symbol} en {chain}',de:'{symbol} auf {chain}',zh:'{chain} 上的 {symbol}'};
 return{src:'/brand/'+id.replace('_','-')+'.png',alt:(words[language]||words.en).replace('{symbol}',mark[0]).replace('{chain}',mark[1])};
}
function loadEVM(v){
 evm=v;if(v.symbol&&v.symbol!=='USDT')for(const k of Object.keys(U))if(typeof U[k]==='string')U[k]=U[k].replace(/USDT/g,v.symbol);document.title='PhoenixMail · '+U.eyebrow;document.querySelector('.eyebrow').textContent=U.eyebrow;
 amountNode.firstChild.textContent=v.amount+' ';const small=amountNode.querySelector&&amountNode.querySelector('small');if(small)small.textContent=v.symbol||'USDT';
 showPalette(evmPaletteFor(v));
 const chain=chainName[v.chain]||'';
 descriptionNode.textContent=(v.protected?U.protectedLabel:U.waiting)+(chain?' · '+chain:'');
 const coin=document.getElementById('cashlink-iqon'),mark=networkMark(v.asset||String(v.symbol||'USDT').toLowerCase()+'_'+String(v.chain||'').toLowerCase(),document.documentElement.lang);if(mark){coin.src=mark.src;coin.alt=mark.alt;}document.getElementById('nimicon').hidden=!mark;
 document.getElementById('wallet-note').textContent=v.message||'';
 if(v.state!=='awaiting_address'){showFinal(v);if(v.state==='ready')pollEvm();return}
 if(!v.protected||v.email_verified){showAddressStep(v.protected?U.verified:'');return}
 canVerify=true;updateControls();
}
evmClaim.onclick=()=>{const to=evmAddress.value.trim();if(!addressOK(to)){setStatus(U.badAddress,'error');return}showConfirmStep(to)};
document.getElementById('evm-confirm-back').onclick=()=>showAddressStep('');
document.getElementById('evm-confirm-yes').onclick=async()=>{
 if(requestBusy)return;const to=document.getElementById('evm-confirm-address').textContent;
 requestBusy=true;const yes=document.getElementById('evm-confirm-yes');yes.setAttribute('aria-busy','true');yes.disabled=true;setStatus('','');
 try{
  const r=await fetch('/api/v1/claims/'+encodeURIComponent(claimId)+'?action=address',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({to})});
  const v=await r.json().catch(()=>({}));
  if(!r.ok){setStatus(evmErrorText(v.error),'error');if(v.error==='invalid_address'||v.error==='same_address')showAddressStep('');return}
  evm=Object.assign(evm,v);showFinal(v);pollEvm();
 }catch{setStatus(feedback[3],'error')}
 finally{requestBusy=false;yes.removeAttribute('aria-busy');yes.disabled=false}
};
async function loadClaim(){
 if(!claimId){status.textContent='Invalid claim identifier';send.disabled=verify.disabled=true;return;}
 try{
  const r=await fetch('/api/v1/claims/'+encodeURIComponent(claimId),{cache:'no-store'});
  const v=await r.json();
  if(!r.ok)throw Error(v.code||v.error||'Claim unavailable');
  showExpiry(v.expires_at);
  if(typeof v.asset==='string'&&v.asset.startsWith('usdt_')){loadEVM(v);return}
  amountNode.firstChild.textContent=v.amount+' ';
  showPalette(previewMode?previewPalette:paletteForClaimId(v.id));
  descriptionNode.textContent=previewMode?text.preview:text.protected;
  if(typeof v.address==='string'&&/^NQ[0-9]{2}[0-9A-Z]{32}$/.test(v.address)){
   const address=window.PhoenixNimiqIdenticons.normalize(v.address);
   document.getElementById('cashlink-iqon').src=await window.NimiqIqonsOfficial.toDataUrl(address);
   document.getElementById('nimicon').hidden=false;
  }
  const note=document.getElementById('wallet-note');
  note.textContent=v.email_verified?text.reopen:text.locked;
  if(v.email_verified)status.textContent=text.reopen;
  canVerify=!previewMode&&(v.status==='otp_required'||v.status==='otp_released');
  updateControls();
 }catch(e){
  status.textContent=gone(e.message)?lifetime.ended:feedback[3];send.disabled=verify.disabled=true;
 }
}
loadClaim();


const more={
 en:{busySend:'Sending…',busyVerify:'Verifying…',wait:'Please wait a minute before requesting another code.',again:'Send again in',sec:'s'},
 fr:{busySend:'Envoi…',busyVerify:'Vérification…',wait:'Patientez une minute avant de demander un autre code.',again:'Renvoyer dans',sec:'s'},
 es:{busySend:'Enviando…',busyVerify:'Verificando…',wait:'Espera un minuto antes de solicitar otro código.',again:'Reenviar en',sec:'s'},
 de:{busySend:'Wird gesendet…',busyVerify:'Wird geprüft…',wait:'Warte eine Minute, bevor du einen weiteren Code anforderst.',again:'Erneut senden in',sec:'s'},
 zh:{busySend:'发送中…',busyVerify:'验证中…',wait:'请等待一分钟后再请求验证码。',again:'重新发送：',sec:'秒'}
}[locale]||{busySend:'Sending…',busyVerify:'Verifying…',wait:'Please wait a minute before requesting another code.',again:'Send again in',sec:'s'};
function setStatus(message,kind){status.className='status'+(kind?' '+kind:'');status.textContent=message;if(message)status.scrollIntoView({block:'nearest',behavior:'smooth'});}
function startCooldown(seconds){clearInterval(coolTimer);cooling=seconds;const tick=()=>{if(cooling<=0){clearInterval(coolTimer);send.textContent=words[3];}else{send.textContent=more.again+' '+cooling+more.sec;}updateControls();};tick();coolTimer=setInterval(()=>{cooling--;tick();},1000);}
async function action(name,data={}){
 if(!claimId||!canVerify||requestBusy)return;
 if(name==='release'&&!/^[0-9]{6}$/.test(data.code||'')){setStatus(feedback[0],'error');updateControls();return;}
 const button=name==='request'?send:verify;let label=button.textContent;
 requestBusy=true;button.setAttribute('aria-busy','true');button.textContent=name==='request'?more.busySend:more.busyVerify;setStatus('','');updateControls();
 let ok=false;
 try{
  const r=await fetch('/api/v1/claims/'+encodeURIComponent(claimId)+'?action='+name,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)});
  const v=await r.json().catch(()=>({}));
  if(!r.ok){
   if(gone(v.code||v.error)){canVerify=false;setStatus(lifetime.ended,'error');return;}
   if(v.error==='wait_before_resend'){setStatus(more.wait,'error');startCooldown(60);}
   else setStatus(v.error==='invalid_or_expired_code'?feedback[1]:v.error==='otp_rate_limited'?feedback[2]:feedback[3],'error');
   return;
  }
  if(name==='request'){ok=true;setStatus(text.sent,'ok');otpInput.value='';otpBoxes.forEach(box=>box.textContent='•');otpInput.focus();startCooldown(60);}
  else if(name==='release' && evm && v.status==='otp_verified'){ok=true;showAddressStep(U.verified)}
  else if(name==='release' && typeof v.cashlink==='string' && /^https:\/\/hub\.nimiq\.com\/cashlink\/#/.test(v.cashlink)){
   // The same button that verified the code becomes the one that opens the wallet: nothing else is left to press.
   canVerify=false;receiveUrl=v.cashlink;setStatus(text.accepted,'ok');
   send.hidden=true;document.getElementById('digits').hidden=true;document.querySelector('label[for="otp"]').hidden=true;
   verify.textContent=text.receive+' →';label=verify.textContent;
   document.getElementById('wallet-note').textContent='Cashlink unlocked';}
  else{setStatus('Claim unavailable.','error');}
 }catch(e){setStatus(feedback[3],'error')}
 finally{requestBusy=false;button.removeAttribute('aria-busy');if(name==='request'&&cooling>0){send.textContent=more.again+' '+cooling+more.sec}else{button.textContent=label}updateControls();}
}
send.onclick=()=>action('request',{lang:locale});verify.onclick=()=>{if(receiveUrl){window.open(receiveUrl,'_blank','noopener,noreferrer');return}return action('release',{code:document.getElementById('otp').value.trim()})};
</script></body></html>
