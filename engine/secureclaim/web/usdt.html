 if(saved.claimSent&&c.state==='verifying'){showStep('step-done');$('doneMsg').textContent=W.verifying;watchPayout();return}
 if(saved.claimSent&&c.state==='paid'){showStep('step-done');$('doneMsg').textContent=W.paid;return}
 const at=saved.attempt,ck=saved.check;
 if(at&&Date.now()-at.at<5*MIN&&ck){check=ck;showStep('step-address');setTo(at.to);return}
 if(ck&&ck.verifiedAt&&Date.now()-ck.verifiedAt<9*MIN){check=ck;showStep('step-address');return}
 if(ck&&!ck.verifiedAt&&Date.now()-ck.at<9*MIN){check=ck;showStep('step-code');return}
 $('step-email').hidden=false}
async function load(){
 let c;try{c=await api('GET','/api/v1/usdt/cards/'+idHex)}catch(e){fail(gone(e)?expiryCopy.ended:e.status===404?W.notFound:err(e));return}
 // The card must be exactly what its owners say, and the link key must be one of them: never trust the server blindly.
 const safe=C.checksum(C.cardAddress({id:link.id,owners:c.owners,threshold:2},c.chain_id));
 if(safe!==c.safe||!c.owners.includes(linkOwner)||c.owners.length!==2){fail(W.badLink);return}
 card=c;W=withSymbol(BASE,c.symbol||'USDT');labels();showCard(c);
 if(saved.claimSent&&c.state==='paid'){resume(c);return}
 if(stateMessage()[c.state]){$('msg').textContent=stateMessage()[c.state];return}
 if(saved.claimSent&&(c.state==='verifying'||c.state==='paid')){resume(c);return}
 if(c.state==='awaiting_funds'||c.state==='verifying'){$('msg').textContent=W.waitFunds;clearTimeout(timer);timer=setTimeout(load,15000);return}
 if(!auth){$('msg').textContent=W.noFee;$('toLabel').textContent=W.addr.replace('{chain}',(c.chain||'').charAt(0).toUpperCase()+(c.chain||'').slice(1));resume(c)}}
// What this browser tab already did survives a reload or a lost answer (session storage: this tab only, gone when it closes): the
// e-mail check, the authorized attempt and its grant. The same operation is retried with the same identifiers, never restarted.
const SKEY='phoenixclaim:'+idHex;
const loadS=()=>{try{return JSON.parse(sessionStorage.getItem(SKEY)||'null')||{}}catch{return{}}};
let saved=loadS();
const saveS=()=>{try{sessionStorage.setItem(SKEY,JSON.stringify(saved))}catch{}};
const MIN=60000;
// ---- 1. the e-mail code comes first ----
let check=null,haveSession=false;
const hexBytes=x=>C.unhex(String(x).replace(/^0x/,''));
async function ensureSession(){if(!haveSession){await api('POST','/api/v1/usdt/sessions');haveSession=true}}
function showStep(id){for(const x of['step-email','step-code','step-address','step-done'])$(x).hidden=x!==id;if(id==='step-address')walletTools()}
async function mailCode(){
 const p=await api('POST','/api/v1/usdt/cards/'+idHex+'/email-checks',{idempotency_key:C.hex(crypto.getRandomValues(new Uint8Array(16)))});
 const m={cardId:link.id,authorizationId:hexBytes(p.authorization_id),sessionBinding:hexBytes(p.session_binding),action:4,emailBinding:hexBytes(p.email_binding),destination:new Uint8Array(20),safeTxHash:new Uint8Array(32),challenge:hexBytes(p.challenge),deadline:p.deadline};
 const sig='0x'+C.hex(await C.signLinkAuthorization(m,card.chain_id,safeOf(),link.key));
 await api('POST','/api/v1/usdt/cards/'+idHex+'/email-checks/'+p.authorization_id+'/code',{signature:sig,lang});
 check={id:p.authorization_id,sig,at:Date.now()};saved={check};saveS()}
$('sendCode').onclick=async()=>{
 const btn=$('sendCode');btn.disabled=true;say($('status0'),W.working);
 try{await ensureSession();await mailCode();say($('status0'),'');showStep('step-code')}
 catch(e){say($('status0'),err(e),'error');btn.disabled=false}};
$('resend').onclick=async()=>{
 const btn=$('resend');btn.disabled=true;say($('status2'),W.working);
 try{await api('POST','/api/v1/usdt/cards/'+idHex+'/email-checks/'+check.id+'/code',{signature:check.sig,lang});say($('status2'),W.codeResent,'ok')}
 catch(e){say($('status2'),err(e),'error')}finally{btn.disabled=false}};
if(navigator.clipboard&&typeof navigator.clipboard.readText==='function'){$('pasteCode').hidden=false;
 $('pasteCode').onclick=async()=>{say($('status2'),'');try{const m=/(?<![0-9])[0-9]{6}(?![0-9])/.exec(await navigator.clipboard.readText());if(m){$('code').value=m[0];await $('verify').onclick()}else say($('status2'),W.pasteCodeNone,'error')}catch{say($('status2'),W.pasteCodeNone,'error')}}}
$('verify').onclick=async()=>{
 const btn=$('verify'),code=$('code').value.trim();if(!/^[0-9]{6}$/.test(code)){say($('status2'),W.errors.invalid_or_expired_code,'error');return}
 btn.disabled=true;say($('status2'),W.working);
 try{await api('POST','/api/v1/usdt/email-checks/'+check.id+'/verify',{code});check.verifiedAt=Date.now();saved.check=check;saveS();say($('status2'),'');showStep('step-address')}
 catch(e){say($('status2'),err(e),'error');btn.disabled=false}};
// ---- 2. then where to receive: the one payment is made from here ----
const showRecap=()=>{const to=toInput.value.trim();$('recap').textContent=/^0x[0-9a-fA-F]{40}$/.test(to)?W.recap.replace('{amount}',card.amount).replace('{to}',to).replace('{fee}',unitsText(card.fee_units)):''};
toInput.addEventListener&&toInput.addEventListener('input',showRecap);
// "sent, being verified" is not the end: the page keeps looking until the payment is confirmed, or says plainly that it did not go through
function watchPayout(){let n=0;
 const look=async()=>{
  try{const c=await api('GET','/api/v1/usdt/cards/'+idHex);
   if(c.state==='paid'){$('doneMsg').textContent=W.paid;$('doneMsg').className='status ok';if(c.tx_url){$('txLink').href=c.tx_url;$('txLink').textContent=W.tx}return}
   if(c.state==='ready'||c.state==='awaiting_funds'){$('doneMsg').textContent=W.failedRetry;$('doneMsg').className='status error';return}
  }catch{}
  if(++n<90)setTimeout(look,4000)};
 setTimeout(look,4000)}
$('next').onclick=async()=>{
 const btn=$('next'),to=toInput.value.trim();if(!/^0x[0-9a-fA-F]{40}$/.test(to)){say($('status1'),W.errors.invalid_address,'error');return}
 btn.disabled=true;say($('status1'),W.working);
 try{
  const u=hexBytes;let s,grant;
  const fresh=at=>at&&at.to===to&&Date.now()-at.at<5*MIN;
  let prev=fresh(saved.attempt)?saved.attempt:null;
  if(prev&&!prev.grant){ // the answer of /grant was lost: ask again with the SAME proof (the service answers a repeated call with the same grant)
   try{grant=(await api('POST','/api/v1/usdt/authorizations/'+prev.id+'/grant',{signature:prev.sig})).grant;prev.grant=grant;saveS()}
   catch(e){if(e&&['expired','conflict','email_check_required','forbidden','card_not_found'].includes(e.code)){delete saved.attempt;delete saved.prep;saveS();prev=null}else throw e}}
  if(prev&&prev.grant){ // a lost answer or a reload: the SAME attempt and grant, nothing is restarted (the e-mail check is already consumed)
   s=prev.snapshot;grant=prev.grant;if(!quoteOk(s,to))throw quoteChanged();auth={id:prev.id,snapshot:s,to}
  }else{
   // the idempotency key is kept BEFORE the request: a lost answer is retried with the same key and returns the same attempt
   if(!saved.prep||saved.prep.to!==to||Date.now()-saved.prep.at>=5*MIN){saved.prep={to,idem:C.hex(crypto.getRandomValues(new Uint8Array(16))),at:Date.now()};saveS()}
   const p=await api('POST','/api/v1/usdt/cards/'+idHex+'/authorizations',{destination:to,idempotency_key:saved.prep.idem,check_id:check.id});
   s=p.snapshot;
   if(!quoteOk(s,to))throw quoteChanged();
   const m={cardId:link.id,authorizationId:u(p.authorization_id),sessionBinding:u(p.session_binding),action:1,emailBinding:u(p.email_binding),destination:u(to),safeTxHash:u(s.safe_tx_hash),challenge:u(p.challenge),deadline:p.deadline};
   const sig='0x'+C.hex(await C.signLinkAuthorization(m,s.chain_id,safeOf(),link.key));
   saved.attempt={id:p.authorization_id,to,snapshot:s,sig,at:Date.now()};saveS(); // the attempt and its proof are kept BEFORE /grant
   grant=(await api('POST','/api/v1/usdt/authorizations/'+p.authorization_id+'/grant',{signature:sig})).grant;
   saved.attempt.grant=grant;saveS();auth={id:p.authorization_id,snapshot:s,to}}
  const cs=await api('POST','/api/v1/usdt/authorizations/'+auth.id+'/signature',{grant});
  const safeBytes=safeOf();
  const tx=C.payout({token:s.token,recipient:to,relayer:s.relayer,amount:BigInt(s.amount_units),fee:BigInt(s.fee_units),nonce:BigInt(s.safe_nonce)});
  // We rebuild the payout ourselves and refuse to sign anything the service described differently.
  if('0x'+C.hex(C.txHash(tx,card.chain_id,safeBytes))!==s.safe_tx_hash)throw Object.assign(Error('quote_changed'),{code:'quote_changed'});
  const mine=await C.signTx(tx,card.chain_id,safeBytes,link.key),raw=C.unhex(cs.signature.replace(/^0x/,''));
  const theirs={owner:C.unhex(cs.owner.replace(/^0x/,'')),sig:{r:raw.slice(0,32),s:raw.slice(32,64),v:raw[64]}};
  const packed=C.packSignatures([mine,theirs]);
  saved.claimSent=true;saveS(); // written BEFORE the request: if the answer is lost the page knows a payment may be on its way
  let r;
  try{r=await api('POST','/api/v1/usdt/authorizations/'+auth.id+'/claims',{grant,signatures:'0x'+C.hex(packed)})}
  catch(e){if(e&&e.code==='payment_in_progress'){r={status:'verifying'}}else throw e}
  showStep('step-done');$('doneMsg').textContent=r.status==='verifying'?W.verifying:W.paid;if(r.status==='verifying')watchPayout();
  if(r.tx&&card.explorer){$('txLink').href=card.explorer+r.tx;$('txLink').textContent=W.tx}
 }catch(e){say($('status1'),err(e),'error');btn.disabled=false}};
load();
})();
</script></body></html>
